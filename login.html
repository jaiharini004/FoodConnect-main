<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FoodConnect</title>
  <meta name="description" content="Log in to the FoodConnect platform.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <a href="index.html" class="nav-logo">Food<span>Connect</span></a>
      <p>Sign in to access the platform</p>
    </div>

    <!-- Body -->
    <div class="login-body">

      <!-- Demo Credentials Notice -->
      <div class="demo-credentials">
        <strong>Demo Admin Login:</strong><br>
        Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong>
        <br><br>
        <strong>Demo User Login:</strong><br>
        Username: <strong>user</strong> &nbsp;|&nbsp; Password: <strong>user123</strong>
        <br><br>
        <span style="color:var(--amber); font-size:0.75rem;">
          These are demo credentials only. In production, use secure backend authentication.
        </span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="Enter username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--mid-grey); padding:0; display:flex; align-items:center;"
              aria-label="Toggle password visibility"
            >
              <span class="material-symbols-outlined" style="font-size:1.1rem;">visibility</span>
            </button>
          </div>
        </div>

        <p class="form-error" id="loginMessage" style="margin-bottom:12px;"></p>

        <button type="submit" class="btn btn-primary" style="width:100%;" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="login-divider" style="margin-top:20px;">
        <a href="index.html" style="color:var(--green); font-weight:700; font-size:0.875rem;">
          Back to FoodConnect
        </a>
      </div>

    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
/* =====================================================
   DEMO LOGIN CREDENTIALS
   
   NOTE FOR PRODUCTION:
   Replace with a proper backend authentication system.
   Never store real credentials in frontend JavaScript.
   Use server-side sessions, JWT tokens, or OAuth.
===================================================== */
const DEMO_CREDENTIALS = {
  admin: { password: 'admin123', role: 'admin', redirect: 'admin.html' },
  user:  { password: 'user123',  role: 'user',  redirect: 'index.html' }
};

/* Toggle password visibility */
document.getElementById('toggle-password').addEventListener('click', () => {
  const input = document.getElementById('password');
  const icon  = document.querySelector('#toggle-password .material-symbols-outlined');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
});

/* Login form */
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  const message  = document.getElementById('loginMessage');
  const btn      = document.getElementById('login-btn');

  message.textContent = '';

  if (!username || !password) {
    message.textContent = 'Please enter your username and password.';
    return;
  }

  btn.textContent = 'Signing in...';
  btn.disabled    = true;

  /* Simulate brief loading */
  setTimeout(() => {
    const cred = DEMO_CREDENTIALS[username];

    if (cred && cred.password === password) {
      sessionStorage.setItem('foodConnectRole', cred.role);
      window.location.href = cred.redirect;
    } else {
      message.textContent = 'Invalid username or password.';
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  }, 600);
});
</script>

</body>
</html>
